# HyDE updates this file whenever the theme changes.
include theme.conf

# Explicitly use the normal-width monospace face instead of a CJK fallback.
font_family JetBrains Mono
font_size 13.0

# Paste text directly; forward the original Ctrl+V to terminal applications.
map ctrl+v paste_from_clipboard
map ctrl+shift+v send_key ctrl+v

# Change font size by one point in the focused terminal window.
map super+plus change_font_size current +1.0
map super+equal change_font_size current +1.0
map super+shift+equal change_font_size current +1.0
map super+kp_add change_font_size current +1.0
map super+minus change_font_size current -1.0
map super+kp_subtract change_font_size current -1.0

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

# Voliteľné nastavenia len tohto notebooku.
include local.conf
